<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1621">
<link rel="icon" href="data:,">
<title>雨宿り AMAYADORI</title>
<style>
/* 界面字体（AmaHudSerif / AmaHudSans）在 scene/hud.*.css 里，开张后在后台加载；没到之前先用系统字体 */
:root {
  color-scheme: dark;
  --night: #0a1621;
  --ink: #f4ecdc;
  --mute: rgba(244, 236, 220, 0.66);
  --faint: rgba(244, 236, 220, 0.42);
  --line: rgba(244, 236, 220, 0.15);
  --glass: rgba(9, 21, 32, 0.56);
  --lamp: #f0c07a;
  --rain: #8fc3e8;
  --serif: 'AmaHudSerif', 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', serif;
  --sans: 'AmaHudSans', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --gut: 22px;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font: 500 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }

#stage { position: fixed; inset: 0; background: var(--night); }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: manipulation; }

/* ── HUD ── */
#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-right, 0px) + var(--gut))
           calc(env(safe-area-inset-bottom, 0px) + 20px) calc(env(safe-area-inset-left, 0px) + var(--gut));
}
#hud > * { pointer-events: auto; transition: opacity 0.9s ease; }
#hud.idle .fade { opacity: 0.28; }
#hud.entered .tonight { opacity: 0; pointer-events: none; }
#hud.embed .brand, #hud.embed .tonight { display: none; }
#hud.waiting .ctrl, #hud.waiting .hint { opacity: 0; pointer-events: none; }
#hud.moving .hint { opacity: 0; }
#hud.intro .ctrl, #hud.intro .hint, #hud.intro .tonight { opacity: 0; pointer-events: none; }
#hud.embed .hint { grid-column: 1 / -1; grid-row: 3; justify-self: center; font-size: 13px; }
/* 嵌入时街上的提示放到顶上正中，底部留给父页面的输入框和字幕 */
@media (min-width: 721px), (orientation: landscape) and (min-width: 521px) { #hud.embed:not(.entered) .hint { grid-row: 1; align-self: start; margin-top: 10px; } }
#hud.entered #enter { color: var(--ink); border-color: rgba(240, 192, 122, 0.55); }
#hud.idle .fade:hover, #hud.idle .fade:focus-within { opacity: 1; }

.brand { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 12px; align-self: start; pointer-events: none; }
.brand svg { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.4)); }
.brand .jp { font: 600 22px/1 'AmaSerif', var(--serif); letter-spacing: 0.14em; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
.brand .en { margin-top: 7px; font: 700 10px/1 var(--sans); letter-spacing: 0.32em; color: var(--mute); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
.brand .en i { font-style: normal; color: var(--faint); }

.ctrl { grid-column: 2; grid-row: 1; display: flex; gap: 8px; align-self: start; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
  backdrop-filter: blur(10px) saturate(1.15); -webkit-backdrop-filter: blur(10px) saturate(1.15);
  font: 500 13px/1 var(--sans); letter-spacing: 0.06em; color: var(--mute);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.pill:hover { color: var(--ink); border-color: rgba(244, 236, 220, 0.34); }
.pill[aria-pressed="true"] { color: var(--ink); border-color: rgba(143, 195, 232, 0.55); }
.pill[aria-pressed="true"]::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--rain); box-shadow: 0 0 8px var(--rain); }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.tonight {
  grid-column: 1; grid-row: 3; align-self: end; justify-self: start;
  width: min(380px, 100%); box-sizing: border-box; padding: 16px 18px 16px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--glass);
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}
.tonight .label { display: flex; align-items: center; gap: 8px; font: 700 11px/1 var(--sans); letter-spacing: 0.24em; color: var(--lamp); }
.tonight .label::before { content: ''; width: 14px; height: 1px; background: currentColor; opacity: 0.7; }
#line { margin: 11px 0 5px; font: 600 19px/1.5 var(--serif); letter-spacing: 0.03em; text-wrap: balance; }
#tag { margin: 0 0 14px; font: 500 13px/1.55 var(--sans); color: var(--mute); letter-spacing: 0.04em; }
.nights { display: flex; flex-wrap: wrap; gap: 8px; }
.nights button {
  height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  font: 500 13px/1 var(--sans); letter-spacing: 0.06em; color: var(--mute);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.nights button:hover { color: var(--ink); border-color: rgba(244, 236, 220, 0.34); }
.nights button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--night); font-weight: 700; }

.hint { grid-column: 2; grid-row: 3; align-self: end; justify-self: end; font: 500 12px/1 var(--sans); letter-spacing: 0.14em; color: var(--faint); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); pointer-events: none; white-space: nowrap; }
.hint .touch { display: none; }
@media (pointer: coarse) { .hint .mouse { display: none; } .hint .touch { display: inline; } }

/* 竖屏的手机、很窄的窗口（横屏的手机走下面「矮屏」那一套） */
@media (max-width: 720px) and (orientation: portrait), (max-width: 520px) {
  :root { --gut: 16px; }
  #hud { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr auto; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .ctrl { grid-column: 1; grid-row: 2; justify-self: start; margin-top: 14px; flex-wrap: wrap; }
  .brand svg { width: 34px; height: 34px; }
  .brand .jp { font-size: 20px; }
  .brand .en i { display: none; }
  .pill { height: 32px; padding: 0 12px; font-size: 12px; }
  .hint { grid-column: 1; grid-row: 3; justify-self: start; align-self: start; margin-top: 12px; font-size: 11px; letter-spacing: 0.1em; }
  .tonight { grid-column: 1; grid-row: 5; width: 100%; padding: 14px 15px; }
  #line { font-size: 17px; margin-top: 9px; }
  #tag { font-size: 12.5px; margin-bottom: 12px; }
  .nights button { flex: 1 1 0; padding: 0 8px; }
}
@media (max-width: 360px) { .pill { padding: 0 10px; letter-spacing: 0.02em; } }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px); transform: translate(-50%, 6px);
  padding: 9px 18px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font: 600 15px/1 var(--serif); letter-spacing: 0.18em; color: var(--ink);
  opacity: 0; pointer-events: none; transition: opacity 0.6s ease, transform 0.6s ease;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }


/* ── 推门之后的过渡视频 ── */
#doorVideo, .clip { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.35s ease; pointer-events: none; background: transparent; }
#doorVideo.on { opacity: 1; }

/* ── 店里 ── */
#basket.has { color: var(--ink); border-color: rgba(240, 192, 122, 0.55); }
#hud.entered .hint { grid-area: auto; position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); justify-self: auto; }
#hud[data-station="door"] .tonight { opacity: 0; pointer-events: none; }
/* 店里的画很亮：上下各压一道淡淡的暗，字和按钮才看得清 */
#hud::before, #hud::after { content: ''; position: absolute; left: 0; right: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
#hud::before { top: 0; height: 150px; background: linear-gradient(rgba(8, 18, 28, 0.42), rgba(8, 18, 28, 0)); }
#hud::after { bottom: 0; height: 220px; background: linear-gradient(rgba(8, 18, 28, 0), rgba(8, 18, 28, 0.5)); }
#hud.entered::before, #hud.entered::after { opacity: 1; }
#hud[data-station="counter"] #receipt { left: 79%; }
.dyn { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
#acts { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); transform: translateX(-50%); display: flex; gap: 10px; transition: opacity 0.4s ease; }
#acts.busy { opacity: 0; pointer-events: none; }
.act {
  height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
  backdrop-filter: blur(10px) saturate(1.15); -webkit-backdrop-filter: blur(10px) saturate(1.15);
  font: 500 14px/1 var(--sans); letter-spacing: 0.08em; color: var(--ink); white-space: nowrap;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.act:hover { border-color: rgba(244, 236, 220, 0.4); transform: translateY(-1px); }
.act.primary { background: rgba(244, 222, 184, 0.92); border-color: transparent; color: #2b2016; font-weight: 700; }
.act.primary:hover { background: #f7e4c2; }
#say {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 124px); transform: translate(-50%, 6px);
  max-width: min(560px, calc(100% - 32px)); padding: 10px 18px; border-radius: 12px; background: rgba(9, 21, 32, 0.62);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 15px; line-height: 1.5; letter-spacing: 0.06em; color: var(--ink); text-align: center;
  opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none;
}
#say.on { opacity: 1; transform: translate(-50%, 0); }
#say:empty { display: none; }
#tags { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s ease; }
#tags.on { opacity: 1; }
#tags.on .pop { pointer-events: auto; }
.pop {
  position: absolute; display: grid; gap: 4px; justify-items: center; width: max-content; min-width: 84px; padding: 9px 14px 8px;
  border: 0; border-radius: 6px; background: #fff7df; color: #2b2016; cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28), inset 0 -2px 0 rgba(0, 0, 0, 0.06);
  transform: translate(-50%, -50%) rotate(-2deg); transition: transform 0.25s ease, background 0.25s ease;
}
.pop:nth-child(2) { transform: translate(-50%, -50%) rotate(1.5deg); }
.pop:hover { transform: translate(-50%, -56%) rotate(0deg) scale(1.05); }
.pop-name { font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
/* 店员手写在价签上的一句（AI 写的） */
.pop-note { max-width: 10.5em; font: 400 13.5px/1.4 'Kaiti SC', 'STKaiti', 'KaiTi', 'BiauKai', 'Songti SC', serif; color: #5b4630; text-align: center; letter-spacing: 0.02em; }
.pop-note:empty { display: none; }
.pop-price { font: 700 13px/1 var(--sans); color: #c4432b; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.pop[aria-pressed="true"] { background: #f6d892; }
.pop[aria-pressed="true"]::after {
  content: '✓'; position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; background: #2b2016; color: #fff7df; font: 700 12px/1 var(--sans);
}
.pop.fly { position: fixed; z-index: 20; pointer-events: none; transition: transform 0.6s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.6s ease; transform: translate(-50%, -50%); }

/* 小票 */
#receipt {
  position: absolute; left: 50%; top: 46%; width: 272px; box-sizing: border-box; padding: 20px 20px 18px;
  background: #fbf8f1; color: #26221d; border-radius: 3px 3px 0 0;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  transform: translate(-50%, -50%) scale(var(--rs, 1)); font-size: 13px; line-height: 1.5; letter-spacing: 0.02em;
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 8px repeat-x;
          mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 8px repeat-x;
  transition: left 0.9s ease, top 0.9s ease, transform 0.9s ease;
}
#receipt.print { animation: printing 1.5s steps(24, end) both; }
@keyframes printing { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
/* 窗边：小票从下往上卷起来，卷成一小卷，再收走 */
#receipt::after {
  content: ''; position: absolute; left: 0; right: 0; top: calc(100% - 14px); height: 14px; border-radius: 7px;
  background: linear-gradient(#cfc6b3, #fbf8f1 38%, #e8e1d2 68%, #aaa08b); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
  opacity: 0; pointer-events: none;
}
#receipt.rolled { pointer-events: none; animation: receipt-roll 1.1s cubic-bezier(0.5, 0, 0.3, 1) forwards, receipt-tuck 0.6s ease-in 1.1s forwards; }
#receipt.rolled::after { animation: receipt-roll-bar 1.1s cubic-bezier(0.5, 0, 0.3, 1) forwards; }
@keyframes receipt-roll { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 calc(100% - 14px) 0); } }
@keyframes receipt-roll-bar { from { opacity: 1; top: calc(100% - 14px); } to { opacity: 1; top: 0; } }
@keyframes receipt-tuck { to { opacity: 0; translate: 0 -40px; } }
@media (prefers-reduced-motion: reduce) {
  #receipt.rolled, #receipt.rolled::after { animation: receipt-tuck 0.4s ease forwards; }
}
#receipt.small { left: calc(100% - 200px); top: 50%; transform: translate(-50%, -50%) rotate(-3deg) scale(var(--rss, 0.86)); }
.r-store { font: 600 17px/1.2 'AmaSerif', var(--serif); letter-spacing: 0.14em; text-align: center; }
.r-sub { margin-top: 4px; text-align: center; font-size: 11px; letter-spacing: 0.4em; color: #6b645a; }
.r-row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.r-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-meta { margin-top: 12px; font-size: 11px; color: #6b645a; }
.r-total { font-weight: 700; font-size: 15px; }
.r-rule { margin: 9px 0; border-top: 1px dashed rgba(38, 34, 29, 0.35); }
.r-item + .r-item { margin-top: 3px; }
.r-note { margin: 1px 0 0 10px; font: 400 12px/1.4 'Kaiti SC', 'STKaiti', 'KaiTi', 'BiauKai', 'Songti SC', serif; color: #6b645a; }
.r-care { margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed rgba(38, 34, 29, 0.35); font-size: 12px; line-height: 1.5; color: #3d372f; }
.r-line { margin: 0; font-size: 13px; }
.r-line:empty { display: none; }
.r-tag { margin: 4px 0 0; font-size: 12px; color: #6b645a; }
.r-thanks { margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: 0.2em; color: #6b645a; }

@media (max-width: 720px) and (orientation: portrait), (max-width: 520px) {
  #hud.entered .hint { position: static; transform: none; grid-column: 1; grid-row: 3; }
  #acts { width: calc(100% - 32px); justify-content: center; }
  .act { flex: 1 1 0; max-width: 200px; padding: 0 12px; }
  #say { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
  #receipt, #hud[data-station="counter"] #receipt { left: 50%; top: 60%; transform: translate(-50%, -50%) scale(0.78); }
  #receipt.small { left: 50%; top: 30%; transform: translate(-50%, -50%) rotate(-2deg) scale(0.7); }
  #tags.col .pop, #tags.col .pop:nth-child(2) { transform: translate(-50%, -50%) rotate(0deg); }
}

/* ── 横屏的手机：屏幕矮，按钮、字、价签、小票都收小一点，把地方留给画 ── */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --gut: 16px; }
  #hud { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .ctrl { gap: 6px; }
  .pill { height: 30px; padding: 0 12px; font-size: 12px; }
  /* 街上、门口的提示放到左上角店名下面，不压招牌 */
  #hud.embed:not(.entered) .hint { justify-self: start; margin-top: 26px; font-size: 12px; letter-spacing: 0.1em; }
  #hud.entered .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 54px); font-size: 11px; letter-spacing: 0.1em; }
  #acts { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 8px; }
  .act { height: 36px; padding: 0 16px; font-size: 13px; }
  #say { bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); margin: 0; padding: 7px 14px; font-size: 14px; }
  /* 收银台：店员的话挪到她那一侧，右边留给小票 */
  #hud[data-station="counter"] #say { left: 36%; max-width: min(46%, 420px); }
  #toast { top: calc(env(safe-area-inset-top, 0px) + 54px); font-size: 14px; }
  .pop { min-width: 70px; padding: 7px 11px 6px; gap: 3px; }
  .pop-name { font-size: 14px; }
  .pop-note { font-size: 12px; }
  .pop-price { font-size: 12px; }
  /* 小票从按钮下面开始往下打；缩放比例由脚本按屏幕高度算好（--rs） */
  #receipt { top: calc(env(safe-area-inset-top, 0px) + 54px); transform-origin: 50% 0; transform: translate(-50%, 0) scale(var(--rs, 0.7)); }
  #receipt.small { left: calc(100% - 100px); top: calc(env(safe-area-inset-top, 0px) + 54px); transform: translate(-50%, 0) rotate(-3deg) scale(var(--rss, 0.45)); }
  #hud::before { height: 96px; }
  #hud::after { height: 150px; }
}

/* ── 开场 ── */
#loading {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  background: radial-gradient(120% 80% at 50% 62%, #143046 0%, #0d1f2e 45%, var(--night) 100%);
  overflow: hidden; transition: opacity 0.9s ease;
}
#loading.gone { opacity: 0; pointer-events: none; }
/* 垫在后面的街景：64×36 的小图放大、模糊，像隔着雨看店里的灯 */
#loading::before {
  content: ''; position: absolute; inset: -60px;
  background: url(data:image/webp;base64,UklGRhoCAABXRUJQVlA4IA4CAAAwCwCdASpAACQAPrVGnUmnI6KhMrScyOAWiUAU6PLX371du9zwBesk1IlCvgWsV/Pk2i/IZTEtOdhvdTPuNukPKMhKpjw1mlbY3EG2kyPDEADIzMc6Zi3JK2KmlanXkkMUAAD+9CUJ75m3gKGl5Kp1YZAF3w4GxEjv7UJZE049noqzyIhQDidvaWtkqJDvyvvsCwmUTpAi0hbNx3oQq1qmBtU34cOgiUPo4eMcgPAjxmywV18KgT8tqh4hgiX6+p6c5fIRbXzigqPtLQC0kRr7uYD/+nDTKRH6nQA/4dgRrGp9tEem+PWuPKk/7WYC1OyGYiLkIlcStHOKchgg69x0CIWlirayymyahG1T3nkQ0M6m3JyOtr8JFL2335Mlq3XIrv9O+L/zy3nqAqYNpCLljRkhTP5dNxaB69wcmvwsjagnjSrLKkqzaEFYTWwRzkmkj9S5UWq4wmLZzPd1kR5fpGLYGSCaQl7VaXEVTzBGuDV+GxbQXC9FNzp2F0LTw4UhVUvleviajHozIZjv3rOFKaOnBuXiztJo/Xvwz7K9sjcR+Iv9xgth+jx6vcGiPHxAbRib+jLLzSsmnGTMitqpC2/JA6Ddrn3xRw3EmY/pTIDo40nDpLBDa02phaWR+Fq1+zF30vaZsaQVR1ruuoj+jkuFUwRrPEbfixXM8wLzVvTmbBPYAPjaSBTWgAAA) 58.5% 47% / cover no-repeat;
  filter: blur(26px) saturate(1.1); opacity: 0.5;
}
#loading .in { position: relative; display: grid; justify-items: center; gap: 16px; padding: 0 var(--gut); text-align: center; }
#loading svg { width: 54px; height: 54px; animation: breathe 2.6s ease-in-out infinite; }
#loading p { margin: 0; font: 500 13px/1 var(--sans); letter-spacing: 0.24em; color: var(--mute); }
/* 下载进度：一根细细的灯管 */
#loading .bar { width: 132px; height: 2px; margin-top: -4px; border-radius: 2px; background: rgba(244, 236, 220, 0.14); overflow: hidden; }
